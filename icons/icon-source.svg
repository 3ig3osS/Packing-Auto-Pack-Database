<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c83f5"/>
      <stop offset="1" stop-color="#3f37c9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="16"/></filter>
    <clipPath id="clipL"><rect x="0" y="0" width="250" height="260"/></clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <g transform="translate(512 505) scale(1.25) translate(-512 -505)">
  <!-- ground shadow -->
  <ellipse cx="512" cy="800" rx="250" ry="52" fill="#1e1b4b" opacity="0.38" filter="url(#blur)"/>

  <!-- box faces -->
  <polygon points="262,375 512,520 512,780 262,635" fill="#dfe4ff"/>
  <polygon points="762,375 512,520 512,780 762,635" fill="#b9c2fb"/>
  <polygon points="512,230 762,375 512,520 262,375" fill="#ffffff"/>

  <!-- tape on top -->
  <polygon points="413,287.5 361,317.5 611,462.5 663,432.5" fill="#fbbf24" transform="translate(0,0)"/>
  <polygon points="413,287.5 361,317.5 361,347.5 413,317.5" fill="#f59e0b" opacity="0"/>

  <!-- LEFT face: PCB traces -->
  <g transform="matrix(1,0.58,0,1,262,375)">
    <g fill="none" stroke="#4f46e5" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
      <path d="M42 62 H118 L152 96 H206"/>
      <path d="M42 132 H88 L124 168 H206"/>
      <path d="M42 202 H146 L176 232 H206"/>
    </g>
    <g fill="#4f46e5">
      <circle cx="42" cy="62" r="15"/><circle cx="206" cy="96" r="15"/>
      <circle cx="42" cy="132" r="15"/><circle cx="206" cy="168" r="15"/>
      <circle cx="42" cy="202" r="15"/><circle cx="206" cy="232" r="15"/>
    </g>
    <g fill="#dfe4ff">
      <circle cx="42" cy="62" r="5.5"/><circle cx="206" cy="96" r="5.5"/>
      <circle cx="42" cy="132" r="5.5"/><circle cx="206" cy="168" r="5.5"/>
      <circle cx="42" cy="202" r="5.5"/><circle cx="206" cy="232" r="5.5"/>
    </g>
  </g>

  <!-- RIGHT face: barcode label -->
  <g transform="matrix(1,-0.58,0,1,512,520)">
    <rect x="34" y="52" width="182" height="150" rx="12" fill="#ffffff"/>
    <g fill="#312e81">
      <rect x="54" y="74" width="9" height="84"/>
      <rect x="70" y="74" width="4" height="84"/>
      <rect x="81" y="74" width="13" height="84"/>
      <rect x="101" y="74" width="5" height="84"/>
      <rect x="113" y="74" width="9" height="84"/>
      <rect x="129" y="74" width="4" height="84"/>
      <rect x="140" y="74" width="14" height="84"/>
      <rect x="161" y="74" width="5" height="84"/>
      <rect x="173" y="74" width="9" height="84"/>
      <rect x="189" y="74" width="4" height="84"/>
    </g>
    <circle cx="70" cy="180" r="9" fill="#22c55e"/>
    <rect x="90" y="174" width="90" height="12" rx="6" fill="#c7d2fe"/>
  </g>

  <!-- edges -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3" stroke-linejoin="round">
    <polyline points="262,375 512,520 762,375"/>
    <line x1="512" y1="520" x2="512" y2="780"/>
  </g>
  </g>
</svg>
